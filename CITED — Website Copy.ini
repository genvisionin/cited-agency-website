SECTION 2 — THE SHIFT
Eyebrow: What's changed
Headline:
Google isn't the only search engine anymore.
Body:
People used to search on Google, scroll links, and click around. That habit is breaking. Now they open ChatGPT or Perplexity, ask a question, and take the AI's recommendation directly.
When someone asks "find me a good dentist in Leeds" — the AI doesn't show ten options. It picks two or three businesses by name and says: these ones. Those businesses get the call. The rest don't get mentioned at all.
This is already happening at scale. ChatGPT has 800 million weekly users. Google is answering searches directly through AI Overviews before anyone clicks a link. Perplexity grew from nothing to hundreds of millions of queries in under two years.
The businesses visible on these platforms are getting customers their competitors never even know they lost.
Four stat cards:
800M+ — Weekly ChatGPT users actively searching for recommendations
58% — of people have replaced Google with AI tools for finding products and services
63% — of websites are now seeing traffic arrive directly from AI search platforms
Zero — UK local businesses with an AI visibility strategy right now

SECTION 3 — WHY NOW
Eyebrow: The window
Headline:
The businesses that move first will be the hardest to displace.
Body:
Think about what happened with Google SEO in 2006. The businesses that invested early held those rankings for years. By the time competitors caught on, the gap was too large to close quickly.
AI visibility works the same way. The more citations, mentions, and trust signals a business builds on these platforms, the more consistently they get recommended. That authority compounds. It doesn't reset.
Right now, almost no UK local businesses have touched this. The competition for AI visibility in Leeds, Manchester, London, Birmingham — it's essentially zero. You could be the recommended dentist, salon, or accommodation in your city before anyone else even knows this matters.
That window won't stay open. US agencies are already moving into the UK market. When AI visibility becomes common knowledge — and it will, fast — the early positions will already be taken.
Four urgency points:
The competition is near zero right now.
No local UK business in your category has an AI visibility strategy. Being first means being recommended before anyone else builds the same foundation.
Early signals compound over time.
AI platforms build trust in businesses through consistent, accumulated signals. A business that starts this today will be significantly harder to displace in 18 months than one that starts then.
54% of US marketers are implementing this within 6 months.
That wave is coming to the UK. The businesses waiting to see how it plays out will be catching up to the ones who moved early.
Google traffic is already declining.
AI Overviews are answering searches without clicks. Traditional SEO is delivering less and less. AI search visibility is where the growth is moving.
Callout quote:
"The businesses that establish AI visibility now will be very difficult to displace once their citation footprint and authority signals are built. First-mover advantage in GEO is real and durable."

